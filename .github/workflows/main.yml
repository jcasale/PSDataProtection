name: CI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup wix
        run: |
          dotnet tool install wix --version 7.0.1 --global
          wix eula accept wix7
          wix extension add WixToolset.UI.wixext/7.0.1

      - name: Generate version properties
        id: version
        run: |
          Set-StrictMode -Version Latest
          cd .\src
          $path = '.\PSDataProtection\PSDataProtection.csproj'
          dotnet build $path -tl:off -p:MinVerVerbosity=detailed

          $properties = dotnet msbuild $path -target:CustomizeVersion -getProperty:MinVerVersion,MinVerMajor,MinVerMinor,MinVerPatch,ProductVersion,ModuleVersion |
            ConvertFrom-Json |
            Select-Object -ExpandProperty Properties

          if ([string]::IsNullOrWhiteSpace($properties.MinVerVersion))
          {
              throw 'Failed to parse the MinVerVersion property.'
          }

          if ([string]::IsNullOrWhiteSpace($properties.MinVerMajor))
          {
              throw 'Failed to parse the MinVerMajor property.'
          }

          if ([string]::IsNullOrWhiteSpace($properties.MinVerMinor))
          {
              throw 'Failed to parse the MinVerMinor property.'
          }

          if ([string]::IsNullOrWhiteSpace($properties.MinVerPatch))
          {
              throw 'Failed to parse the MinVerPatch property.'
          }

          if ([string]::IsNullOrWhiteSpace($properties.ProductVersion))
          {
              throw 'Failed to parse the ProductVersion property.'
          }

          if ([string]::IsNullOrWhiteSpace($properties.ModuleVersion))
          {
              throw 'Failed to parse the ModuleVersion property.'
          }

          @(
              ('version={0}' -f $properties.MinVerVersion)
              ('major={0}' -f $properties.MinVerMajor)
              ('minor={0}' -f $properties.MinVerMinor)
              ('patch={0}' -f $properties.MinVerPatch)
              ('productVersion={0}' -f $properties.ProductVersion)
              ('moduleVersion={0}' -f $properties.ModuleVersion)
          ) |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run tests
        run: |
          cd .\src
          dotnet.exe test --project .\Tests\Tests.csproj --configuration Release --output Detailed

      - name: Publish project
        run: dotnet.exe publish .\src\PSDataProtection\PSDataProtection.csproj --configuration Release --output .\publish

      - name: Prepare release
        run: Remove-Item ./publish/* -Include *.pdb,*.xml -ErrorAction Stop

      - name: Build installer
        run: |
          wix.exe `
            build `
            -arch x64 `
            -src src\Product.wxs `
            -d ProductSource="$(Resolve-Path .\publish)" `
            -d HelpSource="$(Resolve-Path .\docs-maml\PSDataProtection)" `
            -d ProductVersion="${{ steps.version.outputs.productVersion }}" `
            -d ProductVersionFull="${{ steps.version.outputs.version }}" `
            -ext WixToolset.UI.wixext `
            -out ps-data-protection.msi

      - name: Validate installer
        run: wix.exe msi validate ps-data-protection.msi

      - name: Upload msi artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ./ps-data-protection.msi
          if-no-files-found: error

      - name: Install msi
        run: |
          $process = Start-Process msiexec.exe -ArgumentList '/i','ps-data-protection.msi','/qn' -Wait -NoNewWindow -PassThru -ErrorAction Stop
          if ($process.ExitCode -ne 0)
          {
              throw 'Non zero exit code: "{0}".' -f $process.ExitCode
          }

      - name: Test module
        shell: powershell
        run: |
          $PSVersionTable

          Import-Module PSDataProtection -ErrorAction Stop
          Get-Module PSDataProtection |Select-Object -ExpandProperty Path |Split-Path -Parent |Get-ChildItem -Recurse

          $secret = 'Hello World!'
          $secureString = ConvertTo-SecureString $secret -AsPlainText -Force -ErrorAction Stop
          $protected = New-DataProtectionSecret -SecureString $secureString -Scope CurrentUser -ErrorAction Stop
          $unprotected = Read-DataProtectionSecret -Protected $protected -Scope CurrentUser -ErrorAction Stop
          $unprotected
          if ($secret -ne $unprotected) { throw }

      - name: Publish release
        if: github.ref_type == 'tag'
        run: gh.exe release create ${{ steps.version.outputs.version }} --title ${{ steps.version.outputs.version }} --notes 'PowerShell data protection module.' ps-data-protection.msi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
